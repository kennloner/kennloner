    <style>
	
	* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
	}

	body {
			background-color: #000000;
			color: #ffffff;
			font-family: 'Montserrat', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			padding: 40px 0px 20px 0px;
			overflow-x: hidden;
	}

	.main-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			width: 100%;
			flex: 1;
	}
		
	.container {
			max-width: 440px;
			width: 90%;
			text-align: center;
			margin: 0 auto;
			display: flex;
			flex-direction: column;
			align-items: center;
	}

	h1 {
			font-size: 42px;
			font-weight: 900;
			letter-spacing: 14px;
			line-height: 0.95;
			margin-bottom: 5px;
			text-transform: uppercase;
			width: 100%;
	}
		
	p { 
			color: #ffffff;
			font-weight: 600; 
			letter-spacing: 29px; 
			margin-bottom: 9px; 
			font-size: 23px; 
			line-height: 1.2;
			text-transform: uppercase;
	}
				
	.line {
			border: 0;
			height: 1px;
			background: rgba(255, 255, 255, 0.1); 
			width: 100%;      
			margin: 9px auto;
	}
				
	.btn-release {
			display: flex;
			flex-direction: column;
			gap: 1px;
			margin: 1px 0;
			width: 100%;
	}

	
	.custom-btn {
			display: block;
			width: 100%;
			background-color: transparent; 
			color: #ffffff;
			text-decoration: none !important;
			padding: 16px 16px;
			border: 1px solid #333333; 
			border-radius: 9px;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 6px;
			text-transform: uppercase;
			transition: all 0.3s ease;
	}

	.custom-btn:hover {
			background-color: rgba(255, 255, 255, 0.05); 
			border-color: #ffffff; 
			color: #ffffff;
			transform: translateY(-2px);
	}

													/* ACCENTUL VERDE SPOTIFY SHINE MUTAT PE PIESA LANSATĂ (THE TRAMP) */
	.custom-btn.release-active {
			border-color: #1DB954;
			font-weight: 600; 							/* Text mai definit ca să iasă în evidență */
	}

	.custom-btn.release-active:hover {
			background-color: rgba(29, 185, 84, 0.1);
			border-color: #ffffff;
			box-shadow: 0 0 15px rgba(29, 185, 84, 0.3);
	}
	
	.stay-tuned {
			padding: 10px;
			margin-top: 10px;
			margin-bottom: 10px;
			font-size: 14px;
			letter-spacing: 19px;
			text-transform: uppercase;
			font-weight: 600;
			line-height: 1.5;
			animation: sparkle 1.5s infinite alternate;
	}

	@keyframes sparkle {
			
		0% {
				color: #ffffff; 
				text-shadow: 0 0 5px #ffffff;
			}
			
		100% {
				color: #ffd700; 
				text-shadow: 0 0 10px #ffd700; 
			}
	}
			
	 .footer {
			margin-top: 33px;
			font-size: 10px;
			color: #55637a;
			letter-spacing: 2px;
			text-transform: uppercase;
    }

	.social-icons {
			display: flex;
            justify-content: center;
            gap: 22px;
            padding-top: 15px;
			padding-bottom: 15px;
            flex-wrap: wrap;
            width: 100%;
	}

	.social-icons a img {
			width: 20px;
            height: 20px;
            filter: grayscale(100%) brightness(0.8);
            transition: all 0.4s ease;
	}
	
	.social-icons a img:hover {
			filter: grayscale(0%) brightness(1);
            transform: scale(1.15);
	}
		
	.legal-links {
			margin-top: 12px;
			font-size: 9px;
			opacity: 0.5;
	}
	
	.legal-links a {
			color: #ffffff;
			text-decoration: none;
			margin: 0 5px;
			transition: opacity 0.2s;
	}

	.legal-links a:hover {
			opacity: 1;
			text-decoration: underline;
	}
