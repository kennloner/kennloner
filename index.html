<style>
	/* REPARAȚIA ELEMENTARĂ: Menține padding-ul în interiorul celor 100% și centrează tot */
	* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
	}

	body {
			background-color: #0b0e14;
			color: #ffffff;
			font-family: 'Montserrat', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			padding: 40px 0px; /* Am lăsat 0 pe lateral pentru a controla spațiul strict din container */
			position: relative;
			overflow-x: hidden;
	}

	body::before {
			content: "";
			position: fixed;
			top: 0; 
			left: 0;
			width: 100%; 
			height: 100%;
			
			background-size: cover;
			filter: brightness(0.4) contrast(1.1); 
			z-index: -1;
			transform: scale(1.05);
	}

    /* ALINIERE FIXĂ: Forțează containerul să stea pe mijlocul ecranului cu margini egale */
    .container {
            max-width: 440px;
            width: 90%;
            text-align: center;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
    }

	h1 {
			font-size: 42px;
			font-weight: 900;
			letter-spacing: 14px;
			line-height: 0.95;
			margin-bottom: 12px;
		    text-transform: uppercase;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            width: 100%;
	}
	
	.modest-line {
			border: 0;
			height: 1px;
			background: rgba(255, 255, 255, 0.1);
			width: 60px;      
			margin: 25px auto;
	}
	
    /* GLOW BUTTON - COMPLET CENTRAT ȘI CONSTRÂNS SĂ NU DEPĂȘEASCĂ MARGINILE */
    .presave-button {
            display: block;
            width: 100%; 
            background: rgba(29, 185, 84, 0.04);
            color: #ffffff;
            text-decoration: none;
			line-height: 1.6;
			padding: 20px 20px;            
			border: 1px solid rgba(29, 185, 84, 0.6);
            border-radius: 8px; 
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 0 10px rgba(29, 185, 84, 0.1);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
	
    .presave-button:hover {
			transform: translateY(-3px);
            border-color: rgba(29, 185, 84, 1);
            background: rgba(29, 185, 84, 0.12);
			box-shadow: 0 0 25px rgba(29, 185, 84, 0.45), inset 0 0 8px rgba(29, 185, 84, 0.2);
	}
		
	.presave-button span {
			font-size: 9px;
			opacity: 0.8;
			font-weight: 300;
            letter-spacing: 1px;
            display: inline-block;
            margin-top: 3px;
            color: #00f2fe; 
	}

	/* RELEASES BUTTON - FLUID ȘI PERFECT SIMETRIC */
	.releases {
			display: block;
            width: 100%; 
			background-color: rgba(255, 255, 255, 0.02);
			color: #ffffff;
			text-decoration: none !important;
			padding: 20px 20px;
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 8px;
			font-size: 9px;
			font-weight: 600;
			letter-spacing: 3px;
			text-transform: uppercase;
			transition: all 0.3s ease;
			margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
	}

	.releases:hover {
			background-color: rgba(255, 255, 255, 0.06);
			border-color: #00f2fe; 
			color: #ffffff;
			box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
			transform: translateY(-2px);
	}

    .social-icons {
            display: flex;
            justify-content: center;
            gap: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 30px;
            flex-wrap: wrap;
            width: 100%;
    }

    .social-icons a img {
            width: 20px;
            height: 20px;
            filter: grayscale(100%) brightness(0.8);
            transition: all 0.4s ease;
    }
    
    .social-icons a img:hover {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.15);
    }
		
    .footer {
			margin-top: 30px;
			font-size: 8px;
			color: #55637a;
			letter-spacing: 2px;

    }

			text-decoration: none;
			margin: 0 6px;
            transition: color 0.2s;
	}
	
	.legal-links a:hover {
			color: #ffffff;
	}
